<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Compass+ · Planejamento Acadêmico UTFPR</title>
  <meta name="description" content="Planeje sua formatura na UTFPR a partir dos PDFs do Portal do Aluno. Tudo roda no seu navegador." />
  <meta name="color-scheme" content="dark light" />
  <script>
    {
      let salvo = null;
      try {
        salvo = localStorage.getItem("compass_tema");
      } catch {
        salvo = null;
      }
      const claroNoSistema = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme = salvo === "light" || salvo === "dark" ? salvo : claroNoSistema ? "light" : "dark";
    }
  </script>
</head>

<body>
  <noscript>
    <p class="noscript">O Compass+ precisa de JavaScript habilitado.</p>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
